sync:
  name: Sync Cookidoo → Keep
  description: >
    Mergt offene Cookidoo- und Keep-Items, klassifiziert über den
    Lerncache (Bulk-LLM-Call für unbekannte), schreibt sortiert in
    die Keep-Liste und hakt die kopierten Cookidoo-Items dort ab.
  fields:
    entry_id:
      name: Config Entry ID
      description: Optional. Lässt mehrere Konfigurationen unterscheiden.
      required: false
      selector:
        text:

reset_learned:
  name: Gelernte Mappings zurücksetzen
  description: Löscht alle vom LLM gelernten Item→Kategorie-Mappings.
  fields:
    entry_id:
      name: Config Entry ID
      required: false
      selector:
        text:
