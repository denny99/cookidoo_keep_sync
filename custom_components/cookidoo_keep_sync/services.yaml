sync:
  name: Sync Cookidoo → Keep
  description: >
    Mergt offene Cookidoo- und Keep-Items, klassifiziert über den
    Lerncache (Bulk-LLM-Call für unbekannte), schreibt sortiert in
    die Keep-Liste und hakt die kopierten Cookidoo-Items dort ab.
  fields:
    entry_id:
      name: Config Entry ID
      description: >
        Optional. Nur nötig, wenn du mehrere Cookidoo→Keep-Konfigurationen
        eingerichtet hast. Bei einer einzigen Konfiguration leer lassen.
        Die Entry-ID findest du unter Settings → Devices & Services →
        Cookidoo → ⋮ → URL kopieren (am Ende der URL).
      required: false
      example: "01HXXXXX..."
      selector:
        text:

reset_learned:
  name: Gelernte Mappings zurücksetzen
  description: >
    Löscht alle vom LLM gelernten Item→Kategorie-Mappings. Beim nächsten
    Sync werden alle Items erneut vom LLM klassifiziert.
  fields:
    entry_id:
      name: Config Entry ID
      description: >
        Optional. Nur nötig bei mehreren Konfigurationen — siehe sync.
      required: false
      example: "01HXXXXX..."
      selector:
        text:
