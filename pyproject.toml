[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "cookidoo_keep_sync"
version = "0.0.0"
description = "Home Assistant integration: sync Cookidoo shopping list to Google Keep, sorted by personal supermarket order."
requires-python = ">=3.12"

[tool.semantic_release]
version_variables = [
    "custom_components/cookidoo_keep_sync/manifest.json:version",
]
branch = "main"
build_command = ""
commit_message = "chore(release): v{version} [skip ci]"
upload_to_release = true

[tool.semantic_release.commit_parser_options]
# Standard Conventional Commits — feat → minor, fix/perf → patch,
# BREAKING CHANGE: → major
allowed_tags = [
    "feat", "fix", "perf", "refactor", "docs",
    "style", "test", "chore", "ci", "build",
]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
